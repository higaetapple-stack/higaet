name: parity-gate

# Minimal, reality-aligned parity comparator between the new kernel-based CI
# (ci.yml → _ci-kernel core) and the legacy baseline (pr-checks.yml).
#
# Scope constraints (do not expand without evidence):
# - Only compares core CI vs pr-checks. No SEO/security/deploy parity here.
# - Never deploys. Never publishes. Never mutates the repo.
# - This workflow cannot mark itself as a required check — a repo admin must
#   set `parity-gate (stable)` as a required status check in branch
#   protection. See docs/runbooks/ci-parity.md.

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: parity-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ci-run:
    name: CI kernel (core)
    uses: ./.github/workflows/_ci-kernel.yml
    with:
      mode: core
      run-lint: true
      run-typecheck: true
      run-build: true
      upload-artifact: true
      artifact-name: parity-ci-core
    secrets: inherit

  legacy-run:
    name: Legacy pr-checks baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-bun
        with:
          node-version: "22"

      - name: Lint
        id: lint
        run: bun run lint 2>&1 | tee legacy-lint.log

      - name: Typecheck
        id: typecheck
        if: always()
        run: bun run typecheck 2>&1 | tee legacy-typecheck.log

      - name: Build
        id: build
        if: always()
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        # Build is handled by _ci-kernel.yml (build-once contract)
# This workflow must consume the artifact instead of rebuilding.

      - name: Upload legacy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-legacy-logs
          path: |
            legacy-lint.log
            legacy-typecheck.log
            legacy-build.log
          retention-days: 14
          if-no-files-found: warn

  parity-gate:
    # Stable job name for branch protection. Do NOT rename without updating
    # the required-check config in repo Settings → Branches.
    name: parity-gate (stable)
    runs-on: ubuntu-latest
    needs: [ci-run, legacy-run]
    if: always()
    steps:
      - name: Compare results
        id: compare
        run: |
          set -eu
          CI_RESULT="${{ needs.ci-run.result }}"
          LEGACY_RESULT="${{ needs.legacy-run.result }}"
          echo "ci-run: $CI_RESULT"
          echo "legacy-run: $LEGACY_RESULT"

          {
            echo "# CI Parity Report"
            echo ""
            echo "| Lane | Result |"
            echo "|---|---|"
            echo "| ci-run (kernel core) | $CI_RESULT |"
            echo "| legacy-run (pr-checks baseline) | $LEGACY_RESULT |"
            echo ""
          } | tee parity-report.md

          if [ "$CI_RESULT" = "$LEGACY_RESULT" ]; then
            echo "STATUS=PASS (parity: both lanes agree — $CI_RESULT)" | tee -a parity-report.md
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "STATUS=FAIL (divergence: kernel=$CI_RESULT, legacy=$LEGACY_RESULT)" | tee -a parity-report.md
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

          cat parity-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce parity
        if: steps.compare.outputs.status != 'pass'
        run: |
          echo "::error::Parity divergence between ci-run and legacy-run"
          exit 1
